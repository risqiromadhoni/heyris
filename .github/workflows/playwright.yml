name: Playwright

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "uno.config.ts"
      - "void.config.ts"
      - "env.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end and accessibility tests
    # Release calls this workflow after the release PR merges, so the PR itself skips it.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps
      - name: Run Playwright tests
        run: vp run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
