name: Size

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "astro.config.mjs"
      - "uno.config.ts"
      - "void.config.ts"
      - "env.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".size-limit.json"
      - ".github/workflows/size.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: JS and CSS size budgets
    # Release calls this workflow after the release PR merges, so the PR itself skips it.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
      - name: Build
        run: vp run build
      - name: Check size budgets
        run: vp run size
